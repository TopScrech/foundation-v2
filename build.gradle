configurations.portedApiImplementation.extendsFrom(configurations.implementation)
configurations.portedApiCompileOnly.extendsFrom(configurations.compileOnly)
tasks.register('portedApiAgent', Jar) {
    dependsOn tasks.named('portedApiClasses')
    archiveFileName = 'foundation-native-checks-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('ported-api/agent')
    from(sourceSets.portedApi.output) { include 'foundation/verification/ForgeCapabilityTestAgent*' }
    manifest.attributes('Premain-Class': 'foundation.verification.ForgeCapabilityTestAgent')
}
tasks.register('verifyPortedApi', JavaExec) {
    dependsOn tasks.named('portedApiClasses')
    classpath = sourceSets.portedApi.runtimeClasspath
    mainClass = 'foundation.verification.SharedApiSmokeKt'
    workingDir = layout.buildDirectory.dir('ported-api/api-run').get().asFile
    doFirst { workingDir.mkdirs() }
    systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('verifyGameBootstrap', JavaExec) {
    dependsOn tasks.named('portedApiClasses'), tasks.named('portedApiAgent')
    classpath = sourceSets.portedApi.runtimeClasspath
    mainClass = 'foundation.verification.GameBootstrapSmokeKt'
    systemProperty 'foundation.resourcesRoot', file('src/main/resources').absolutePath
    if (System.getenv('FOUNDATION_REFERENCE_FORGE')) {
        systemProperty 'foundation.legacyForgeJar', System.getenv('FOUNDATION_REFERENCE_FORGE')
    }
    systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
    workingDir = layout.buildDirectory.dir('ported-api/bootstrap-run').get().asFile
    doFirst {
        workingDir.mkdirs()
        jvmArgs "-javaagent:${tasks.named('portedApiAgent').get().archiveFile.get().asFile.absolutePath}"
    }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.named('check') { dependsOn 'verifyPortedApi', 'verifyGameBootstrap' }

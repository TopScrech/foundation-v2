plugins {
    id 'net.minecraftforge.gradle' version '7.0.17'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

def foundationCacheRoot = System.getenv('FOUNDATION_CACHE_ROOT') ?: new File(System.getProperty('user.home'), '.cache/foundation-v2/forge-26.3').absolutePath
def cacheRoot = new File(foundationCacheRoot).canonicalFile
if (cacheRoot.toPath().startsWith(projectDir.canonicalFile.toPath())) {
    throw new GradleException('Build cache must be outside the project folder')
}
layout.buildDirectory = new File(cacheRoot, 'build')
group = 'foundation'
version = '2.0.0'
base.archivesName = 'Foundation'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
kotlin.jvmToolchain(25)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.buildDirectory.dir("run/${name}")
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
        register('server') { args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven' }
}

configurations { embeddedRuntime }
dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.5')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'
    embeddedRuntime 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'
    compileOnly 'org.spongepowered:mixin:0.8.7'
}

// Keep every integrated source in compilation so unported code cannot disappear from a release
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from 'LICENSE.txt'
    exclude 'mcmod.info', 'META-INF/*_at.cfg'
    from { configurations.embeddedRuntime.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**'
    manifest.attributes(
        'Implementation-Title': 'Foundation v2',
        'Implementation-Version': project.version,
        'MixinConfigs': 'mixins.foundation.json'
    )
}

// Validate modern loader metadata and reject legacy loader classes before a release is accepted
tasks.register('verifyRelease', Exec) {
    dependsOn tasks.jar
    commandLine 'python3', file('tools/verify_release.py').absolutePath, tasks.jar.archiveFile.get().asFile.absolutePath
}
tasks.named('check') { dependsOn 'verifyRelease' }

